name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@0cd25fb25787c04f19ffcbd98591c542baf4b8bc # v1.11.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@d82ddc1a7ec28bdfac53050f25a742800fe11584 # v1.7.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  build-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@23a29fee6d6f6d7ea571b87c786a6ad7fcd6e618 # v2.9.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          use_builder: ${{ matrix.target }}
          run_safety_checks: ${{ matrix.target == 'toolforge-stable' && 'true' || 'false' }}

  test-container:
    runs-on: ubuntu-latest
    needs: [build-container]
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          docker run -d --name alloy -p 8118:8118 \
            -e ALLOY_SEND_TO_LOCAL_CLUSTER=false \
            -e ALLOY_REMOTE_URL=http://127.0.0.1:9090/api/v1/write \
            -e ALLOY_SCRAPE_DEFAULT_JOBS=false \
            -e ALLOY_SCRAPE_NAMESPACE_JOBS=false \
            -e ALLOY_SCRAPE_TARGETS='[{"host": "localhost", "port": 8118}]' \
            --entrypoint /cnb/process/run-alloy \
            ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}

      - name: Verify alloy is ready
        run: |
          timeout 30 bash -c 'until curl --silent --fail http://127.0.0.1:8118/-/ready; do sleep 1; done'

      - name: Container logs
        if: always()
        run: docker logs alloy
