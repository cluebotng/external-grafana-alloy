[project]
name = "grafana-alloy"
version = "1.0"
requires-python = ">=3.14"
dependencies = [
    # Need at least 1 dep as the build pack installs against the "main" group,
    # which doesn't exist if there are no dependencies...
    "pip>=26.2.2"
]

[tool.poetry.build]
generate-setup-file = false
script = "setup.py"

[tool.poetry.group.test.dependencies]
tox = ">=4.67.4"
tox-current-env = ">=0.0.17"
black = ">=26.10.1"
ruff = ">=0.17.3"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
